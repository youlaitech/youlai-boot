# springdoc 配置文档: https://springdoc.org/properties.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html # Swagger UI 访问路径
    operationsSorter: alpha # 接口按方法名排序
    tags-sorter: alpha # 标签按字母排序
  api-docs:
    path: /v3/api-docs # OpenAPI JSON 地址
  group-configs: # 分组配置
    - group: "系统管理" # 分组名称
      paths-to-match: "/**" # 匹配的请求路径
      packages-to-scan: # 扫描的 Controller 包，限制只生成指定包的接口文档
        - com.youlai.boot.auth.password.controller
        - com.youlai.boot.auth.sms.controller
        - com.youlai.boot.auth.qrcode.controller
        - com.youlai.boot.auth.wxma.controller
        - com.youlai.boot.auth.session.controller
        - com.youlai.boot.system.controller
        - com.youlai.boot.codegen.controller
        - com.youlai.boot.module.form.controller
        - com.youlai.boot.module.workflow.controller
  default-flat-param-object: true

# knife4j 配置
knife4j:
  enable: true
  # 生产环境设置为 true 关闭文档
  production: false
  setting:
    language: zh_cn

# xxl-job 定时任务配置
xxl:
  job:
    # 定时任务开关
    enabled: false
    admin:
      # 多个地址使用,分割
      addresses: http://127.0.0.1:8686/xxl-job-admin
    accessToken: default_token
    executor:
      appname: xxl-job-executor-${spring.application.name}
      address:
      ip:
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

# 验证码配置
captcha:
  # 验证码类型 circle-圆圈干扰验证码|gif-Gif验证码|line-干扰线验证码|shear-扭曲干扰验证码
  type: circle
  # 验证码宽度
  width: 120
  # 验证码高度
  height: 40
  # 验证码干扰元素个数
  interfere-count: 2
  # 文本透明度(0.0-1.0)
  text-alpha: 0.8
  # 验证码字符配置
  code:
    # 验证码字符类型 math-算术|random-随机字符
    type: math
    # 验证码字符长度，type=算术时，表示运算位数(1:个位数运算 2:十位数运算)；type=随机字符时，表示字符个数
    length: 1
  # 验证码字体
  font:
    # 字体名称 Dialog|DialogInput|Monospaced|Serif|SansSerif
    name: SansSerif
    # 字体样式 0-普通|1-粗体|2-斜体
    weight: 1
    # 字体大小
    size: 24
  # 验证码有效期(秒)
  expire-seconds: 120

# 微信小程序配置
wx:
  miniapp:
    appid: Your_AppId
    secret: Your_AppSecret

# 工作流（默认关闭，开启见 README「可选扩展」）
flowable:
  # 工作流总开关，未配置视为关闭
  enabled: false
  # 引擎表初始化策略，true 启动时检查并自动建/更新 ACT_* 表；可选 true/false/create/create-drop
  database-schema-update: true
  demo:
    # 演示流程自动部署开关
    enabled: true
