server:
  port: 8000

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver # 3.2.0开始支持SPI可省略此配置
    url: jdbc:mysql://www.youlai.tech:3306/youlai_admin?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true&allowMultiQueries=true
    username: youlai
    password: 123456
  data:
    redis:
      database: 0
      host: www.youlai.tech
      port: 6379
      password: 123456
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数 默认8 ，负数表示没有限制
          max-active: 8
          # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认-1
          max-wait: -1
          # 连接池中的最大空闲连接 默认8
          max-idle: 8
          # 连接池中的最小空闲连接 默认0
          min-idle: 0
  cache:
    enabled: false
    # 缓存类型 redis、none(不使用缓存)
    type: redis
    # 缓存时间(单位：ms)
    redis:
      time-to-live: 3600000
      # 缓存null值，防止缓存穿透
      cache-null-values: true
    caffeine:
      spec: initialCapacity=50,maximumSize=1000,expireAfterWrite=600s
  # 邮件配置
  mail:
    host: smtp.youlai.tech
    port: 587
    username: your-email@example.com
    password: 123456
    properties:
      smtp:
        auth: true
        starttls:
          enable: true
    # 邮件发送者
    from: youlaitech@163.com
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      # 主键ID类型
      id-type: none
      # 逻辑删除对应的全局属性名（注意：须是对象属性名，不能是表字段名，如 isDeleted 而非 is_deleted，否则逻辑删除失效）
      logic-delete-field: isDeleted
      # 逻辑删除-删除值
      logic-delete-value: 1
      # 逻辑删除-未删除值
      logic-not-delete-value: 0
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 接口限流
rate-limit:
  default-limit: 60
  default-window: 60s
  ip:
    enabled: true     # 开发环境开启 IP 全局限流（供限流测试）
    limit: 1000
    window: 60s

# 安全配置
security:
  token:
    type: jwt # 令牌策略 [jwt|redis-token]
    access-token-time-to-live: 7200 # 访问令牌 有效期(单位：秒)，默认 2 小时，-1 表示永不过期
    refresh-token-time-to-live: 604800 # 刷新令牌有效期(单位：秒)，默认 7 天，-1 表示永不过期
    jwt:
      secret-key: SecretKey012345678901234567890123456789012345678901234567890123456789 # JWT密钥(HS256算法至少32字符)
    redis-token:
      allow-multi-login: true # 是否允许多设备登录
  # 匿名放行路径，仅跳过认证与授权判断，仍走过滤器链（保留安全响应头）
  permit-all-urls:
    - /api/v1/auth/login/** # 登录接口(账号密码登录)
    - /api/v1/auth/captcha # 验证码获取接口
    - /api/v1/auth/sms/** # 短信验证码接口(发送验证码、短信登录)
    - /api/v1/auth/refresh-token # 刷新令牌接口
    - /api/v1/auth/wxma/** # 微信小程序认证接口(静默登录/手机号快捷登录/绑定手机号)
    - /api/v1/logs/** # 日志接口(访问日志列表)
    - /api/v1/auth/qr-code/** # 扫码登录接口(生成票据/查询状态/换取令牌)
    - /api/v1/forms/public/** # 公开表单接口(匿名渲染/提交，Service 校验 is_public 总闸 + IP 限流)
    - ${springdoc.swagger-ui.path} # Swagger UI 路径
    - /doc.html
    - /swagger-ui/**
    - /v3/api-docs/**
    - /webjars/**
    - /favicon.ico
    - /error

# 文件存储
storage:
  # 存储类型：s3 | aliyun | local
  type: s3
  # 上传限制
  upload:
    # 单文件大小上限（同时作为 spring.servlet.multipart 的上限，单一来源）
    max-file-size: 50MB
    # 允许的文件扩展名白名单（置空表示不限制）
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
  # S3 对象存储（S3 协议兼容服务，默认部署 RustFS）
  s3:
    endpoint: http://111.229.83.153:9000
    access-key: bybaddp7zyARpgNbEGKf
    secret-key: p9rBdQZPBIJcMH23iyFkZkXmmawbmwPlk3JLlaaj
    bucket: public
    # 自定义域名：配置后文件 URL 走域名，留空则用 endpoint（IP）格式
    domain:
  # 阿里云 OSS
  aliyun:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: your-access-key-id
    access-key-secret: your-access-key-secret
    bucket: default
  # 本地存储
  local:
    # 存储根目录（相对路径基于工作目录；生产建议挂载独立卷）
    path: ./uploads/

